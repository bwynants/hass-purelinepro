[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purelinepro-ble"
version = "1.1.0"
description = "BLE protocol library for the Novy Pureline Pro extractor hood"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["bleak>=0.21"]

[project.urls]
Homepage = "https://github.com/bwynants/hass-purelinepro"
